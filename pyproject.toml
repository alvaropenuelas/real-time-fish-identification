[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["notebooks", "data", "weights", "outputs"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, comprehensions
select = ["E", "F", "I", "W", "B", "UP", "C4"]
ignore = ["B008"]  # allow function calls in argument defaults (argparse/types)
