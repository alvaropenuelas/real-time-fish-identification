name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU-only torch keeps the runner small; the test needs torch/torchvision/numpy/pillow.
      # (weights/model.pt is gitignored, so the integration test self-skips here.)
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pillow pytest
      - run: pytest tests/test_classifier.py -v
